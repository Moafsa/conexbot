services:
  app:
    image: conext-app-local:latest
    container_name: conext-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/conext_db?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-conextbot-local-secret-32-chars-long}
      NEXTAUTH_URL: http://localhost:3000
      UZAPI_URL: http://uzapi:8080
      UZAPI_SECRET_KEY: admin_token_123
      WUZAPI_ADMIN_TOKEN: admin_token_123
      INTERNAL_WEBHOOK_URL: http://app:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9002/media # Acesso via host para o browser
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9002/media
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: media
      # AI provider keys (picked up from .env in the project root)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Redis / distributed locks + buffering
      REDIS_URL: redis://redis:6379
      # Worker concurrency (how many messages processed in parallel)
      WORKER_CONCURRENCY: "4"
      # Webhook secret — must match WUZAPI_ADMIN_TOKEN sent by WuzAPI
      UZAPI_WEBHOOK_SECRET: admin_token_123
      # Cron secret for /api/cron/* endpoints
      CRON_SECRET: local-cron-secret-change-in-prod
      # Chatwoot auto-provisioning (Platform API — PlatformApp token, not user token)
      CHATWOOT_BASE_URL: http://conext-chatwoot-web:3000
      CHATWOOT_SUPERADMIN_TOKEN: ${CHATWOOT_SUPERADMIN_TOKEN:-8pcKNhsUPZyLRdMzkHcSYGER}
    command: sh -c "npx prisma migrate deploy && exec node server.js"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: conext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: conext_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d conext_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conext-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  uzapi:
    image: asternic/wuzapi:latest
    container_name: conext-uzapi
    restart: unless-stopped
    environment:
      WUZAPI_ADMIN_TOKEN: admin_token_123
      API_KEY: admin_token_123
      WUZAPI_HTTP_PORT: 8080
      TZ: America/Sao_Paulo
    ports:
      - "21465:8080"
    volumes:
      - wuzapi_data:/app/data
      - wuzapi_sessions:/app/sessions
      - wuzapi_db:/app/dbdata

  minio:
    image: minio/minio
    container_name: conext-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/media;
      /usr/bin/mc anonymous set public myminio/media;
      exit 0;
      "

  message-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: conext-worker-local:latest
    container_name: conext-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/conext_db?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-conextbot-local-secret-32-chars-long}
      UZAPI_URL: http://uzapi:8080
      UZAPI_SECRET_KEY: admin_token_123
      WUZAPI_ADMIN_TOKEN: admin_token_123
      INTERNAL_WEBHOOK_URL: http://app:3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9002/media
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9002/media
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: media
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "4"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    # CMD is already set in Dockerfile.worker (npx tsx src/workers/message-worker.ts)

  cron-worker:
    image: alpine:latest
    container_name: conext-cron
    depends_on:
      - app
    # Runs follow-up every 60s and renew-usage once per hour (~3600s cycle)
    command: >
      sh -c "
        apk add --no-cache wget > /dev/null 2>&1;
        TICK=0;
        while true; do
          wget -qO- --header='Authorization: Bearer local-cron-secret-change-in-prod' http://app:3000/api/cron/follow-up > /dev/null 2>&1;
          TICK=$((TICK+1));
          if [ $((TICK % 60)) -eq 0 ]; then
            wget -qO- --header='Authorization: Bearer local-cron-secret-change-in-prod' http://app:3000/api/cron/renew-usage > /dev/null 2>&1;
          fi;
          sleep 60;
        done
      "
    restart: unless-stopped

  chatwoot-web:
    image: ghcr.io/fazer-ai/chatwoot:v4.14.0-fazer-ai.74
    container_name: conext-chatwoot-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3005:3000"
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=chatwoot-local-secret-32-chars-long-base
      - FRONTEND_URL=http://localhost:3005
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=admin
      - POSTGRES_PASSWORD=password123
      - REDIS_URL=redis://redis:6379/1
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - chatwoot_storage:/app/storage
    command: sh -c "rm -f tmp/pids/server.pid && bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"

  chatwoot-worker:
    image: ghcr.io/fazer-ai/chatwoot:v4.14.0-fazer-ai.74
    container_name: conext-chatwoot-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=chatwoot-local-secret-32-chars-long-base
      - FRONTEND_URL=http://localhost:3005
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=admin
      - POSTGRES_PASSWORD=password123
      - REDIS_URL=redis://redis:6379/1
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - chatwoot_storage:/app/storage
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  pgdata:
  redisdata:
  wuzapi_data:
  wuzapi_sessions:
  wuzapi_db:
  miniodata:
  chatwoot_storage:
